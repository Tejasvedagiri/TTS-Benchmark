[project]
name = "tts-benchmark"
version = "0.1.0"
description = "Render one script with every open TTS model, side by side: an LLM labels the script and writes each engine's version, each engine runs in its own environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "soundfile",
]

[project.scripts]
server = "bench.report:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.ruff]
line-length = 100
extend-exclude = ["envs", "vendor", "archive", "output"]

[tool.ruff.lint]
select = ["E", "F", "W"]
